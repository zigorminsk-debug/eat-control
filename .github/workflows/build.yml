name: Сборка

# Автосборка после каждого изменения в репозитории.
# Результат: подписанный release-APK в артефактах сборки.
on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Подготовить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Подготовить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить компоненты SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Собрать release
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Собрать debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Проверить подпись постоянным ключом
        run: |
          chmod +x .github/scripts/verify-signature.sh
          .github/scripts/verify-signature.sh $(ls app/build/outputs/apk/release/*.apk | head -1)

      - name: Отчёт о линте
        if: always()
        run: ./gradlew --no-daemon lintRelease || true

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: food-diary-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
