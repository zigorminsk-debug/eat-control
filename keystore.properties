# Постоянный ключ подписи release-сборок.
# Один и тот же ключ во всех сборках -> обновление поверх ранее установленной версии.
# Ключ действителен до 2056 года, пароли заданы один раз и больше не меняются.
#
# ВНИМАНИЕ: файл keystore/release.keystore и эти пароли лежат в репозитории,
# чтобы автоматическая сборка в GitHub Actions всегда подписывала приложение
# тем же ключом. Если репозиторий станет публичным и важна безопасность,
# перенесите ключ в GitHub Secrets (см. .github/workflows/release.yml) и удалите
# его из репозитория.
storeFile=keystore/release.keystore
storePassword=fooddiary-release-2026
keyAlias=food-diary
keyPassword=fooddiary-release-2026

# Отпечаток сертификата (SHA-256). Используется CI для проверки, что сборка
# подписана именно этим ключом. Не менять после первого релиза.
sha256=09:F2:08:8D:8A:EF:AB:63:E9:47:57:6D:5C:C3:5B:08:7E:B8:6A:56:92:43:84:22:24:54:29:F7:C8:29:74:06
